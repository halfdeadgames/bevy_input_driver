[package]
name = "bevy_input_driver"
version = "0.1.0"
edition = "2024"
description = "Drive a running Bevy game with injected input and screenshots over BRP or a script file."
license = "MIT OR Apache-2.0"
repository = "https://github.com/halfdeadgames/bevy_input_driver"
readme = "README.md"
keywords = ["bevy", "testing", "automation", "input", "screenshot"]
categories = ["game-development", "development-tools::testing"]
publish = false

[dependencies]
bevy = { version = "0.20.1", default-features = false, features = [
    "std",
    "bevy_log",
    "bevy_window",
    "gamepad",
    "bevy_clipboard",
    "bevy_render",
    "bevy_remote",
    "bevy_picking",
    "serialize",
    "png",
] }
# The crate, not Bevy's `bevy_winit` feature: that feature would add `WinitPlugin` to every
# game's `DefaultPlugins`, headless ones included. Default features stay on because winit does
# not compile on Linux without its `x11` or `wayland` backend.
bevy_winit = "0.20.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
bevy = "0.20.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
