[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"

# Shared build folder for every Bevy 0.20 project, so Bevy is compiled once and
# reused by all projects. The path is relative to the folder that holds .cargo,
# so it is a .target folder next to this project's folder. A git worktree kept
# somewhere else gets its own .target folder instead. Only one build can run in
# it at a time (cargo waits on its lock). Trim it by hand from any project that
# uses it: cargo sweep --time 14 (add --dry-run first to see what goes).
[build]
target-dir = "../.target/bevy-0.20"
